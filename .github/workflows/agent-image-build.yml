name: Agent image build

on:
  workflow_call:
    inputs:
      target:
        description: Exact isolated delivery target.
        required: true
        type: string
      source_sha:
        description: Exact source commit to check out and bake into the image.
        required: true
        type: string
    outputs:
      image_digest:
        description: Fresh immutable image selected by this build job.
        value: ${{ jobs.build.outputs.image_digest }}

permissions: {}

jobs:
  build:
    name: Build immutable agent image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      image_digest: ${{ steps.image.outputs.image_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker-container
      - name: Select exact builder identity
        id: delivery_identity
        env:
          DELIVERY_ROLE: builder
          DELIVERY_TARGET: ${{ inputs.target }}
        shell: bash
        run: scripts/validate_agent_delivery_identity.sh >>"$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ steps.delivery_identity.outputs.workload_identity_provider }}
          service_account: ${{ steps.delivery_identity.outputs.service_account }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: "577.0.0"
      - name: Build and push one immutable runtime image
        id: image
        env:
          DELIVERY_RUN_ATTEMPT: ${{ github.run_attempt }}
          DELIVERY_RUN_ID: ${{ github.run_id }}
          IMAGE_REPOSITORY: ${{ steps.delivery_identity.outputs.image_repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DELIVERY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$DELIVERY_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet
          image_tag="${IMAGE_REPOSITORY}:git-${SOURCE_SHA}-run-${DELIVERY_RUN_ID}-attempt-${DELIVERY_RUN_ATTEMPT}"
          metadata_file="$RUNNER_TEMP/agent-image-metadata.json"
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --build-arg "VCS_REF=${SOURCE_SHA}" \
            --tag "$image_tag" \
            --metadata-file "$metadata_file" \
            --push \
            .
          digest="$(jq -er '."containerimage.digest"' "$metadata_file")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_digest="${IMAGE_REPOSITORY}@${digest}"
          docker buildx imagetools inspect "$image_digest" >/dev/null
          {
            printf '### Agent image identity\n\n'
            printf -- '- Linux amd64 runtime: %s\n' "$image_digest"
          } >>"$GITHUB_STEP_SUMMARY"
          printf 'image_digest=%s\n' "$image_digest" >>"$GITHUB_OUTPUT"
