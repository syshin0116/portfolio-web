name: Application CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: ci/changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.components.outputs.web }}
      agent: ${{ steps.components.outputs.agent }}
      eval: ${{ steps.components.outputs.eval }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false
      - name: Test component change detection
        run: >-
          uv run --no-project --with pyyaml==6.0.3
          python -m unittest discover -s scripts/tests -v
      - name: Detect affected components
        id: components
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: >-
          python3 scripts/ci_changed_components.py
          --event "${{ github.event_name }}"
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --output "$GITHUB_OUTPUT"
      - name: Validate component outputs
        env:
          WEB_CHANGED: ${{ steps.components.outputs.web }}
          AGENT_CHANGED: ${{ steps.components.outputs.agent }}
          EVAL_CHANGED: ${{ steps.components.outputs.eval }}
        shell: bash
        run: |
          for value in "$WEB_CHANGED" "$AGENT_CHANGED" "$EVAL_CHANGED"; do
            if [[ "$value" != "true" && "$value" != "false" ]]; then
              echo "::error::component change detection emitted an invalid value: $value"
              exit 1
            fi
          done

  web:
    name: ci/web
    if: always()
    needs:
      - changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      AUTH_SECRET: ci-only-auth-secret-ci-only-auth-secret
      AUTH_ALLOWED_EMAILS: ci@example.com
      AGENT_AUTH_SECRET: ci-only-agent-secret-ci-only-agent-secret
      NEXT_PUBLIC_AGENT_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail closed if change detection failed
        if: needs.changes.result != 'success'
        run: exit 1
      - name: Report an unaffected component
        if: needs.changes.outputs.web != 'true'
        run: echo "No web-affecting paths changed; ci/web reports success without rebuilding."
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.changes.outputs.web == 'true'
        with:
          node-version: "24.14.0"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: needs.changes.outputs.web == 'true'
        with:
          bun-version: 1.3.10
      - if: needs.changes.outputs.web == 'true'
        run: bun install --frozen-lockfile
      - if: needs.changes.outputs.web == 'true'
        run: bun run prebuild
      - if: needs.changes.outputs.web == 'true'
        run: bun run test
      - if: needs.changes.outputs.web == 'true'
        run: bun run lint
      - if: needs.changes.outputs.web == 'true'
        run: bunx tsc --noEmit --incremental false
      - if: needs.changes.outputs.web == 'true'
        run: bun run build

  agent:
    name: ci/agent
    if: always()
    needs:
      - changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agent
    env:
      AGENT_AUTH_SECRET: ci-only-agent-secret-ci-only-agent-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail closed if change detection failed
        if: needs.changes.result != 'success'
        run: exit 1
      - name: Report an unaffected component
        if: needs.changes.outputs.agent != 'true'
        run: echo "No agent-affecting paths changed; ci/agent reports success without rebuilding."
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: needs.changes.outputs.agent == 'true'
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        if: needs.changes.outputs.agent == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - if: needs.changes.outputs.agent == 'true'
        run: uv sync --frozen --all-extras --dev
      - if: needs.changes.outputs.agent == 'true'
        run: >-
          uv run ruff check
          src
          tests
          ../scripts/build_index.py
          ../scripts/ci_changed_components.py
          ../scripts/tests
      - if: needs.changes.outputs.agent == 'true'
        run: >-
          uv run ruff format --check
          src
          tests
          ../scripts/build_index.py
          ../scripts/ci_changed_components.py
          ../scripts/tests
      - name: Build and audit the published corpus and BM25 artifacts
        if: needs.changes.outputs.agent == 'true'
        run: >-
          uv run --frozen python ../scripts/build_index.py
          --expect-document-count 335
      - if: needs.changes.outputs.agent == 'true'
        run: uv run --all-extras pytest -q

  eval:
    name: ci/eval
    if: always()
    needs:
      - changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail closed if change detection failed
        if: needs.changes.result != 'success'
        run: exit 1
      - name: Report an unaffected component
        if: needs.changes.outputs.eval != 'true'
        run: echo "No eval-affecting paths changed; ci/eval reports success without rebuilding."
      - name: Guard the future eval workspace
        if: needs.changes.outputs.eval == 'true'
        shell: bash
        run: |
          if [[ -d eval ]]; then
            echo "::error::eval/ exists but ci/eval is still the foundation guard; replace this step with the real frozen-install, schema, metric, registry, and no-cost sweep gates."
            exit 1
          fi
          echo "eval/ is not present yet; ci/eval will become executable in the eval workspace PR."

  check:
    name: ci/check
    if: always()
    needs:
      - changes
      - web
      - agent
      - eval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every Application CI job to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          WEB_RESULT: ${{ needs.web.result }}
          AGENT_RESULT: ${{ needs.agent.result }}
          EVAL_RESULT: ${{ needs.eval.result }}
        shell: bash
        run: |
          results=(
            "ci/changes=$CHANGES_RESULT"
            "ci/web=$WEB_RESULT"
            "ci/agent=$AGENT_RESULT"
            "ci/eval=$EVAL_RESULT"
          )
          failed=0
          for result in "${results[@]}"; do
            echo "$result"
            if [[ "$result" != *=success ]]; then
              failed=1
            fi
          done
          exit "$failed"
