name: Application CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: ci/changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      web: ${{ steps.components.outputs.web }}
      agent: ${{ steps.components.outputs.agent }}
      eval: ${{ steps.components.outputs.eval }}
      infra: ${{ steps.components.outputs.infra }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          checksum: 600cf9a742aca00d292673b16b5acffaa7b8c269a364ad0c2e79498dcb1fe101
          enable-cache: false
      - name: Sync the frozen repository test toolchain
        run: uv sync --frozen --package syshin0116-dev-agent --all-extras --dev
      - name: Test component change detection
        run: >-
          uv run --frozen --package syshin0116-dev-agent
          python -m unittest discover -s scripts/tests -v
      - name: Detect affected components
        id: components
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: >-
          python3 scripts/ci_changed_components.py
          --event "$EVENT_NAME"
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --output "$GITHUB_OUTPUT"
      - name: Validate component outputs
        env:
          WEB_CHANGED: ${{ steps.components.outputs.web }}
          AGENT_CHANGED: ${{ steps.components.outputs.agent }}
          EVAL_CHANGED: ${{ steps.components.outputs.eval }}
          INFRA_CHANGED: ${{ steps.components.outputs.infra }}
        shell: bash
        run: |
          for value in "$WEB_CHANGED" "$AGENT_CHANGED" "$EVAL_CHANGED" "$INFRA_CHANGED"; do
            if [[ "$value" != "true" && "$value" != "false" ]]; then
              echo "::error::component change detection emitted an invalid value: $value"
              exit 1
            fi
          done

  web:
    name: ci/web
    if: always()
    needs:
      - changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
        env:
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: web
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=require
      AUTH_DATABASE_MIGRATION_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
      AUTH_POSTGRES_TEST_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
      AUTH_SECRET: ci-only-auth-secret-ci-only-auth-secret
      AUTH_ALLOWED_EMAILS: ci@example.com
      AUTH_GITHUB_ID: ci-github-client-id
      AUTH_GITHUB_SECRET: ci-github-client-secret
      AUTH_GOOGLE_ID: ci-google-client-id
      AUTH_GOOGLE_SECRET: ci-google-client-secret
      AGENT_AUTH_SECRET: ci-only-agent-secret-ci-only-agent-secret
      NEXT_PUBLIC_AGENT_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail closed if change detection failed
        if: needs.changes.result != 'success'
        run: exit 1
      - name: Report an unaffected component
        if: needs.changes.outputs.web != 'true'
        run: echo "No web-affecting paths changed; ci/web reports success without rebuilding."
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.changes.outputs.web == 'true'
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: needs.changes.outputs.web == 'true'
        with:
          bun-version: 1.3.14
      - if: needs.changes.outputs.web == 'true'
        run: bun install --frozen-lockfile
      - name: Apply and verify the Auth.js schema contract
        if: needs.changes.outputs.web == 'true'
        run: bun run auth:migrate --allow-insecure-loopback-test
      - name: Reject Auth.js schema drift independently
        if: needs.changes.outputs.web == 'true'
        run: bun run auth:verify --allow-insecure-loopback-test
      - name: Exercise Auth.js against PostgreSQL 17
        if: needs.changes.outputs.web == 'true'
        run: bun run test:auth-postgres
      - if: needs.changes.outputs.web == 'true'
        run: bun run prebuild
      - if: needs.changes.outputs.web == 'true'
        run: bun run test
      - if: needs.changes.outputs.web == 'true'
        run: bun run lint
      - if: needs.changes.outputs.web == 'true'
        run: bunx tsc --noEmit --incremental false
      - if: needs.changes.outputs.web == 'true'
        run: bun run build
      - name: Install the pinned Chromium browser
        if: needs.changes.outputs.web == 'true'
        run: bunx playwright install --with-deps chromium
      - name: Exercise the production assistant runtime in a browser
        if: needs.changes.outputs.web == 'true'
        run: bun run test:browser
      - name: Exercise the real site routes for accessibility and responsive layout
        if: needs.changes.outputs.web == 'true'
        run: bun run test:site-browser
      - name: Upload revision-bound browser evidence
        if: always() && needs.changes.outputs.web == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assistant-ui-browser-${{ github.sha }}
          path: |
            web/playwright-report/${{ github.sha }}
            web/test-results/${{ github.sha }}
            web/playwright-site-report/${{ github.sha }}
            web/test-results/site/${{ github.sha }}
          if-no-files-found: error
          retention-days: 14

  agent:
    name: ci/agent
    if: always()
    needs:
      - changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
        env:
          POSTGRES_DB: aegra_ci
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d aegra_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AEGRA_POSTGRES_TEST_URL: postgresql://postgres@localhost:5432/aegra_ci
      AGENT_AUTH_SECRET: ci-only-agent-secret-ci-only-agent-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail closed if change detection failed
        if: needs.changes.result != 'success'
        run: exit 1
      - name: Report an unaffected component
        if: needs.changes.outputs.agent != 'true'
        run: echo "No agent-affecting paths changed; ci/agent reports success without rebuilding."
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: needs.changes.outputs.agent == 'true'
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: needs.changes.outputs.agent == 'true'
        with:
          version: "0.12.3"
          checksum: 600cf9a742aca00d292673b16b5acffaa7b8c269a364ad0c2e79498dcb1fe101
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Verify the workspace lockfile is current
        if: needs.changes.outputs.agent == 'true'
        run: uv lock --check
      - if: needs.changes.outputs.agent == 'true'
        run: >-
          uv sync --frozen --package syshin0116-dev-agent --all-extras --dev
      - if: needs.changes.outputs.agent == 'true'
        run: >-
          uv run --frozen --package syshin0116-dev-agent ruff check
          agent/src
          agent/tests
          scripts/build_index.py
          scripts/ci_changed_components.py
          scripts/upstream_version_audit.py
          scripts/verify_repository_governance.py
          scripts/verify_vercel_production.py
          scripts/tests
      - if: needs.changes.outputs.agent == 'true'
        run: >-
          uv run --frozen --package syshin0116-dev-agent ruff format --check
          agent/src
          agent/tests
          scripts/build_index.py
          scripts/ci_changed_components.py
          scripts/upstream_version_audit.py
          scripts/verify_repository_governance.py
          scripts/verify_vercel_production.py
          scripts/tests
      - name: Build and audit the published corpus and BM25 artifacts
        if: needs.changes.outputs.agent == 'true'
        run: >-
          uv run --frozen --package syshin0116-dev-agent
          python scripts/build_index.py
      - if: needs.changes.outputs.agent == 'true'
        run: >-
          uv run --frozen --package syshin0116-dev-agent --all-extras pytest -q agent/tests
      - name: Build, inspect, and smoke the Linux amd64 delivery image
        if: needs.changes.outputs.agent == 'true'
        shell: bash
        run: |
          set -euo pipefail
          image_tag="agent-ci:$GITHUB_SHA"
          container_name="agent-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            exit_code=$?
            trap - EXIT
            if docker container inspect "$container_name" >/dev/null 2>&1; then
              docker container logs "$container_name" || true
              docker container rm --force "$container_name" >/dev/null || true
            fi
            exit "$exit_code"
          }
          trap cleanup EXIT

          docker build \
            --file Dockerfile \
            --platform linux/amd64 \
            --build-arg "VCS_REF=$GITHUB_SHA" \
            --tag "$image_tag" \
            .
          test "$(
            docker image inspect \
              --format '{{.Os}}/{{.Architecture}}' \
              "$image_tag"
          )" = "linux/amd64"

          docker run \
            --rm \
            --network host \
            --entrypoint python \
            --env "DATABASE_URL=$AEGRA_POSTGRES_TEST_URL" \
            --env ENV_MODE=PRODUCTION \
            --env RUN_MIGRATIONS_ON_STARTUP=false \
            "$image_tag" \
            -m agent.migrate

          docker run \
            --detach \
            --name "$container_name" \
            --network host \
            --env AEGRA_CONFIG=/app/aegra.json \
            --env AGENT_AUTH_SECRET=ci-only-agent-secret-ci-only-agent-secret \
            --env BG_JOB_MAX_RETRIES=0 \
            --env "DATABASE_URL=$AEGRA_POSTGRES_TEST_URL" \
            --env ENV_MODE=PRODUCTION \
            --env FF_V2_EVENT_STREAMING=true \
            --env HOST=0.0.0.0 \
            --env LANGGRAPH_MAX_POOL_SIZE=4 \
            --env LANGGRAPH_MIN_POOL_SIZE=1 \
            --env MODEL=openai:gpt-5.6-luna \
            --env OPENAI_API_KEY=ci-only-not-a-real-openai-key \
            --env PORT=8080 \
            --env REDIS_BROKER_ENABLED=false \
            --env RUN_MIGRATIONS_ON_STARTUP=false \
            --env SQLALCHEMY_MAX_OVERFLOW=0 \
            --env SQLALCHEMY_POOL_SIZE=2 \
            "$image_tag" \
            >/dev/null

          health_ready=false
          for _ in {1..120}; do
            test "$(
              docker container inspect \
                --format '{{.State.Running}}' \
                "$container_name"
            )" = "true"
            if curl \
              --fail \
              --silent \
              --max-time 3 \
              --output /dev/null \
              http://127.0.0.1:8080/live \
              && curl \
                --fail \
                --silent \
                --max-time 3 \
                --output /dev/null \
                http://127.0.0.1:8080/ready
            then
              health_ready=true
              break
            fi
            sleep 1
          done
          test "$health_ready" = "true"

          unauthenticated_status="$(
            curl \
              --silent \
              --show-error \
              --max-time 5 \
              --max-redirs 0 \
              --output /dev/null \
              --write-out '%{http_code}' \
              --header 'content-type: application/json' \
              --data \
                '{"id":1,"method":"run.start","params":{"assistant_id":"agent","input":{"messages":[{"role":"user","content":"ci"}]}}}' \
              http://127.0.0.1:8080/threads/00000000-0000-4000-8000-000000000001/commands
          )"
          test "$unauthenticated_status" = "401"

  native_apv2:
    name: ci/native-apv2
    if: always()
    needs:
      - changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
        env:
          POSTGRES_DB: aegra_ci
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d aegra_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: agent
    env:
      AEGRA_JS_SDK_E2E: "1"
      AEGRA_POSTGRES_TEST_URL: postgresql://postgres@localhost:5432/aegra_ci
      AGENT_AUTH_SECRET: ci-only-agent-secret-ci-only-agent-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail closed if change detection failed
        if: needs.changes.result != 'success'
        run: exit 1
      - name: Report an unaffected runtime boundary
        if: needs.changes.outputs.web != 'true' && needs.changes.outputs.agent != 'true'
        run: echo "No web- or agent-affecting paths changed; ci/native-apv2 reports success without rebuilding."
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.changes.outputs.web == 'true' || needs.changes.outputs.agent == 'true'
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: needs.changes.outputs.web == 'true' || needs.changes.outputs.agent == 'true'
        with:
          bun-version: 1.3.14
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: needs.changes.outputs.web == 'true' || needs.changes.outputs.agent == 'true'
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: needs.changes.outputs.web == 'true' || needs.changes.outputs.agent == 'true'
        with:
          version: "0.12.3"
          checksum: 600cf9a742aca00d292673b16b5acffaa7b8c269a364ad0c2e79498dcb1fe101
          enable-cache: false
      - name: Install the frozen web dependency graph
        if: needs.changes.outputs.web == 'true' || needs.changes.outputs.agent == 'true'
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Install the frozen agent dependency graph
        if: needs.changes.outputs.web == 'true' || needs.changes.outputs.agent == 'true'
        run: uv sync --frozen --all-extras --dev
      - name: Require the official JavaScript SDK boundary
        if: needs.changes.outputs.web == 'true' || needs.changes.outputs.agent == 'true'
        run: test "$AEGRA_JS_SDK_E2E" = "1"
      - name: Exercise JavaScript SDK to Aegra to PostgreSQL 17
        if: needs.changes.outputs.web == 'true' || needs.changes.outputs.agent == 'true'
        run: >-
          uv run --frozen pytest -q
          tests/integration_tests/test_aegra_postgres.py
          -k native_v2_http_interrupt_resume_persists_checkpoint

  eval:
    name: ci/eval
    if: always()
    needs:
      - changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: eval
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail closed if change detection failed
        if: needs.changes.result != 'success'
        run: exit 1
      - name: Report an unaffected component
        if: needs.changes.outputs.eval != 'true'
        run: echo "No eval-affecting paths changed; ci/eval reports success without rebuilding."
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: needs.changes.outputs.eval == 'true'
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: needs.changes.outputs.eval == 'true'
        with:
          version: "0.12.3"
          checksum: 600cf9a742aca00d292673b16b5acffaa7b8c269a364ad0c2e79498dcb1fe101
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Verify the workspace lockfile is current
        if: needs.changes.outputs.eval == 'true'
        run: uv lock --check
      - if: needs.changes.outputs.eval == 'true'
        run: >-
          uv sync --frozen --package syshin0116-dev-eval --all-groups
      - if: needs.changes.outputs.eval == 'true'
        run: >-
          uv run --frozen --package syshin0116-dev-eval ruff check src tests
      - if: needs.changes.outputs.eval == 'true'
        run: >-
          uv run --frozen --package syshin0116-dev-eval
          ruff format --check src tests
      - if: needs.changes.outputs.eval == 'true'
        run: uv run --frozen --package syshin0116-dev-eval pytest
      - name: Build and inspect the Linux amd64 publication image
        if: needs.changes.outputs.eval == 'true'
        shell: bash
        run: |
          set -euo pipefail
          image_tag="blogeval-ci:$GITHUB_SHA"
          docker build \
            --file Dockerfile.publication \
            --platform linux/amd64 \
            --tag "$image_tag" \
            ..
          test "$(
            docker image inspect \
              --format '{{.Os}}/{{.Architecture}}' \
              "$image_tag"
          )" = "linux/amd64"
      - name: Build the pinned published corpus for the no-cost sweep
        if: needs.changes.outputs.eval == 'true'
        run: >-
          uv run --frozen --package syshin0116-dev-eval
          python ../scripts/build_index.py
          --output "$RUNNER_TEMP/eval-index"
      - name: Verify and byte-compare two deterministic known-item sweeps
        if: needs.changes.outputs.eval == 'true'
        shell: bash
        run: |
          set -euo pipefail
          content_tree_sha="$(git rev-parse HEAD:content)"
          uv run --frozen --package syshin0116-dev-eval \
            blogeval generate-known-item \
            --index-root "$RUNNER_TEMP/eval-index" \
            --content-tree-sha "$content_tree_sha" \
            --output querysets/known-item-alias-v1.json \
            --check
          uv run --frozen --package syshin0116-dev-eval blogeval validate \
            --index-root "$RUNNER_TEMP/eval-index" \
            --content-tree-sha "$content_tree_sha" \
            --dataset querysets/known-item-alias-v1.json
          for output_root in \
            "$RUNNER_TEMP/eval-results-first" \
            "$RUNNER_TEMP/eval-results-second"
          do
            uv run --frozen --package syshin0116-dev-eval blogeval sweep \
              --index-root "$RUNNER_TEMP/eval-index" \
              --content-tree-sha "$content_tree_sha" \
              --dataset querysets/known-item-alias-v1.json \
              --output-root "$output_root"
            test "$(find "$output_root" -name run.json -type f | wc -l)" -eq 1
            test "$(find "$output_root" -name leaderboard.md -type f | wc -l)" -eq 1
            test "$(find "$output_root" -name per-query.md -type f | wc -l)" -eq 1
            test "$(find "$output_root" -name metrics.svg -type f | wc -l)" -eq 1
            test "$(find "$output_root" -name manifest.json -type f | wc -l)" -eq 1
            run_json="$(find "$output_root" -name run.json -type f)"
            run_directory="${run_json%/run.json}"
            uv run --frozen --package syshin0116-dev-eval \
              blogeval verify-run \
              --index-root "$RUNNER_TEMP/eval-index" \
              --content-tree-sha "$content_tree_sha" \
              --dataset querysets/known-item-alias-v1.json \
              --run-directory "$run_directory"
          done
          first_run_json="$(
            find "$RUNNER_TEMP/eval-results-first" -name run.json -type f
          )"
          second_run_json="$(
            find "$RUNNER_TEMP/eval-results-second" -name run.json -type f
          )"
          first_run_directory="${first_run_json%/run.json}"
          second_run_directory="${second_run_json%/run.json}"
          diff --no-dereference --recursive \
            "$first_run_directory" \
            "$second_run_directory"

  infra:
    name: ci/infra
    if: always()
    needs:
      - changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail closed if change detection failed
        if: needs.changes.result != 'success'
        run: exit 1
      - name: Report an unaffected component
        if: needs.changes.outputs.infra != 'true'
        run: echo "No infrastructure-affecting paths changed; ci/infra reports success without rebuilding."
      - name: Lint GitHub Actions workflows
        if: needs.changes.outputs.infra == 'true'
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: needs.changes.outputs.infra == 'true'
        with:
          version: "0.12.3"
          checksum: 600cf9a742aca00d292673b16b5acffaa7b8c269a364ad0c2e79498dcb1fe101
          enable-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: needs.changes.outputs.infra == 'true'
        with:
          python-version: "3.12"
      - name: Sync the frozen infrastructure toolchain
        if: needs.changes.outputs.infra == 'true'
        run: uv sync --frozen --package syshin0116-dev-agent --all-extras --dev
      - name: Lint infrastructure Python contracts
        if: needs.changes.outputs.infra == 'true'
        run: |
          uv run --frozen --package syshin0116-dev-agent ruff check \
            scripts/ops_foundation_contract.py \
            scripts/ops_foundation_live_toolchain.py \
            scripts/verify_gcp_project_readiness.py \
            scripts/tests/test_agent_delivery_identity.py \
            scripts/tests/test_ops_foundation_contract.py \
            scripts/tests/test_ops_foundation_live_toolchain.py \
            scripts/tests/test_verify_gcp_project_readiness.py \
            scripts/tests/test_verify_ops_foundation.py
          uv run --frozen --package syshin0116-dev-agent ruff format --check \
            scripts/ops_foundation_contract.py \
            scripts/ops_foundation_live_toolchain.py \
            scripts/verify_gcp_project_readiness.py \
            scripts/tests/test_agent_delivery_identity.py \
            scripts/tests/test_ops_foundation_contract.py \
            scripts/tests/test_ops_foundation_live_toolchain.py \
            scripts/tests/test_verify_gcp_project_readiness.py \
            scripts/tests/test_verify_ops_foundation.py
      - name: Audit GitHub Actions security
        if: needs.changes.outputs.infra == 'true'
        run: uvx --from zizmor==1.28.0 zizmor .github/workflows
      - name: Check the operations verifier
        if: needs.changes.outputs.infra == 'true'
        run: |
          shellcheck \
            scripts/validate_agent_delivery_identity.sh \
            scripts/verify_ops_foundation.sh
          scripts/verify_ops_foundation.sh --static
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: needs.changes.outputs.infra == 'true'
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Check Terraform formatting
        if: needs.changes.outputs.infra == 'true'
        run: scripts/verify_ops_foundation.sh --terraform-fmt
      - name: Initialize Terraform without remote credentials
        if: needs.changes.outputs.infra == 'true'
        run: scripts/verify_ops_foundation.sh --terraform-init
      - name: Validate Terraform configuration
        if: needs.changes.outputs.infra == 'true'
        run: scripts/verify_ops_foundation.sh --terraform-validate
      - name: Test the exact Terraform stage contracts
        if: needs.changes.outputs.infra == 'true'
        run: scripts/verify_ops_foundation.sh --terraform-test

  check:
    name: ci/check
    if: always()
    needs:
      - changes
      - web
      - agent
      - native_apv2
      - eval
      - infra
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every Application CI job to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          WEB_RESULT: ${{ needs.web.result }}
          AGENT_RESULT: ${{ needs.agent.result }}
          NATIVE_APV2_RESULT: ${{ needs.native_apv2.result }}
          EVAL_RESULT: ${{ needs.eval.result }}
          INFRA_RESULT: ${{ needs.infra.result }}
        shell: bash
        run: |
          results=(
            "ci/changes=$CHANGES_RESULT"
            "ci/web=$WEB_RESULT"
            "ci/agent=$AGENT_RESULT"
            "ci/native-apv2=$NATIVE_APV2_RESULT"
            "ci/eval=$EVAL_RESULT"
            "ci/infra=$INFRA_RESULT"
          )
          failed=0
          for result in "${results[@]}"; do
            echo "$result"
            if [[ "$result" != *=success ]]; then
              failed=1
            fi
          done
          exit "$failed"
