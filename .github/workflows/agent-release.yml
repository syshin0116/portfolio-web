name: Agent release

on:
  workflow_call:
    inputs:
      target:
        description: Exact isolated delivery target.
        required: true
        type: string
      environment:
        description: Exact reviewer-gated GitHub release environment.
        required: true
        type: string
      source_sha:
        description: Exact source commit baked into the reviewed candidate.
        required: true
        type: string
      image_digest:
        description: Fresh immutable image from the build workflow.
        required: true
        type: string
    secrets:
      AGENT_SMOKE_BEARER_TOKEN:
        required: true

permissions: {}

jobs:
  release:
    name: Deploy reviewed agent image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - name: Select exact deployer identity
        id: delivery_identity
        env:
          DELIVERY_ENVIRONMENT: ${{ inputs.environment }}
          DELIVERY_ROLE: deployer
          DELIVERY_TARGET: ${{ inputs.target }}
        shell: bash
        run: scripts/validate_agent_delivery_identity.sh >>"$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ steps.delivery_identity.outputs.workload_identity_provider }}
          service_account: ${{ steps.delivery_identity.outputs.service_account }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: "577.0.0"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          checksum: 04f8b82f5d47f0512dcd32c67a4a6f16a0ea27c81537c338fd0ad6b23cebe829
          enable-cache: false
      - name: Deploy, smoke, and promote
        env:
          CLOUD_RUN_SERVICE: ${{ steps.delivery_identity.outputs.cloud_run_service }}
          GCP_PROJECT_ID: festive-ally-503605-v7
          GCP_PROJECT_NUMBER: "72919926064"
          GCP_REGION: asia-southeast1
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          SMOKE_BEARER_TOKEN: ${{ secrets.AGENT_SMOKE_BEARER_TOKEN }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TARGET: ${{ inputs.target }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$TARGET" in
            preview)
              expected_repository="asia-southeast1-docker.pkg.dev/${GCP_PROJECT_ID}/agent-preview/agent"
              ;;
            production)
              expected_repository="asia-southeast1-docker.pkg.dev/${GCP_PROJECT_ID}/agent/agent"
              ;;
            *)
              printf 'unsupported deployment target\n' >&2
              exit 1
              ;;
          esac
          digest="${IMAGE_DIGEST#"${expected_repository}@sha256:"}"
          [[ "$IMAGE_DIGEST" == "${expected_repository}@sha256:${digest}" ]]
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]

          gcloud run services update "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "$IMAGE_DIGEST" \
            --no-traffic \
            --tag smoke \
            --deploy-health-check \
            --quiet
          revision="$(
            gcloud run services describe "$CLOUD_RUN_SERVICE" \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" \
              --format 'value(status.latestReadyRevisionName)'
          )"
          deployed_image="$(
            gcloud run revisions describe "$revision" \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" \
              --format 'value(spec.containers[0].image)'
          )"
          [[ "$deployed_image" == "$IMAGE_DIGEST" ]]

          smoke_url="https://smoke---${CLOUD_RUN_SERVICE}-${GCP_PROJECT_NUMBER}.${GCP_REGION}.run.app"

          verify_release() {
            curl --fail --silent --show-error --max-time 20 \
              --retry 5 --retry-all-errors --retry-delay 2 \
              "${smoke_url}/live" | jq -e '. == {"status":"alive"}' >/dev/null
            curl --fail --silent --show-error --max-time 20 \
              --retry 5 --retry-all-errors --retry-delay 2 \
              "${smoke_url}/ready" | jq -e '. == {"status":"ready"}' >/dev/null
            LIVE_SMOKE_TOKEN="$SMOKE_BEARER_TOKEN" \
              uv run --frozen --package syshin0116-dev-agent \
              python scripts/smoke.py \
                --base-url "$smoke_url" \
                --assistant-id agent \
                --profile aegra-0.9.25 \
                --token-env LIVE_SMOKE_TOKEN \
                --timeout 180
          }

          if ! verify_release; then
            gcloud run services update-traffic "$CLOUD_RUN_SERVICE" \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" \
              --remove-tags smoke \
              --quiet || true
            exit 1
          fi

          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --remove-tags smoke \
            --quiet
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --to-revisions "${revision}=100" \
            --quiet
          printf 'Cloud Run release passed: %s %s\n' "$revision" "$IMAGE_DIGEST"
