name: Dependency audit

on:
  schedule:
    # Monday 03:17 Asia/Seoul. Keep this offset from Dependabot's 04:00 run.
    - cron: "17 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: dependency/web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Verify the committed web lock
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Audit the fail-closed web dependency policy
        run: bun run audit:security

  agent:
    name: dependency/agent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          checksum: 600cf9a742aca00d292673b16b5acffaa7b8c269a364ad0c2e79498dcb1fe101
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Verify and export the committed agent lock
        run: |
          uv lock --project agent --check
          uv export \
            --project agent \
            --package syshin0116-dev-agent \
            --frozen \
            --all-extras \
            --no-emit-project \
            --no-hashes \
            --format requirements-txt \
            --output-file "$RUNNER_TEMP/agent-requirements.txt"
      - name: Audit the exact agent resolution
        run: >-
          uvx --from pip-audit==2.10.1
          pip-audit
          --disable-pip
          --no-deps
          --progress-spinner=off
          --requirement "$RUNNER_TEMP/agent-requirements.txt"

  eval:
    name: dependency/eval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          checksum: 600cf9a742aca00d292673b16b5acffaa7b8c269a364ad0c2e79498dcb1fe101
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Verify and export the committed dense eval lock
        run: |
          uv lock --check
          uv export \
            --package syshin0116-dev-eval \
            --extra dense \
            --all-groups \
            --frozen \
            --no-emit-workspace \
            --no-hashes \
            --format requirements-txt \
            --output-file "$RUNNER_TEMP/eval-requirements.txt"
      - name: Audit the exact dense eval resolution
        run: >-
          uvx --from pip-audit==2.10.1
          pip-audit
          --vulnerability-service osv
          --strict
          --disable-pip
          --no-deps
          --progress-spinner=off
          --requirement "$RUNNER_TEMP/eval-requirements.txt"

  upstream:
    name: dependency/upstream-versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Compare exact pins with stable official releases
        run: >-
          python scripts/upstream_version_audit.py
          --output "$RUNNER_TEMP/upstream-version-audit.json"
          --summary "$GITHUB_STEP_SUMMARY"

  check:
    name: dependency/audit
    if: always()
    needs:
      - web
      - agent
      - eval
      - upstream
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every dependency audit to pass
        env:
          WEB_RESULT: ${{ needs.web.result }}
          AGENT_RESULT: ${{ needs.agent.result }}
          EVAL_RESULT: ${{ needs.eval.result }}
          UPSTREAM_RESULT: ${{ needs.upstream.result }}
        shell: bash
        run: |
          echo "dependency/web=$WEB_RESULT"
          echo "dependency/agent=$AGENT_RESULT"
          echo "dependency/eval=$EVAL_RESULT"
          echo "dependency/upstream-versions=$UPSTREAM_RESULT"
          [[ "$WEB_RESULT" == "success" && "$AGENT_RESULT" == "success" && "$EVAL_RESULT" == "success" && "$UPSTREAM_RESULT" == "success" ]]
