name: Deploy agent

on:
  push:
    branches:
      - main
    paths:
      - ".dockerignore"
      - "Dockerfile"
      - "Dockerfile.dockerignore"
      - "aegra.json"
      - "agent/**"
      - "content/**"
      - "eval/pyproject.toml"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/build_index.py"
      - "scripts/deploy_cloud_run.sh"
      - "scripts/smoke.py"
      - "scripts/validate_agent_release_candidate.py"
      - "scripts/validate_agent_delivery_identity.sh"
      - ".github/workflows/agent-image-build.yml"
      - ".github/workflows/agent-release.yml"
      - ".github/workflows/deploy-agent.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: Deploy main or roll traffic back to an existing revision.
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - rollback
      rollback_revision:
        description: Required only for rollback mode.
        required: false
        type: string

permissions: {}

concurrency:
  group: agent-production
  cancel-in-progress: false

jobs:
  build:
    name: agent/production-build
    if: >-
      vars.AGENT_CLOUD_RUN_ENABLED == 'true'
      && (github.event_name != 'workflow_dispatch' || inputs.mode == 'deploy')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/agent-image-build.yml
    with:
      target: production
      source_sha: ${{ github.sha }}

  release:
    name: agent/production-release
    needs:
      - build
    if: >-
      always()
      && vars.AGENT_CLOUD_RUN_ENABLED == 'true'
      && (
        needs.build.result == 'success'
        || (
          github.event_name == 'workflow_dispatch'
          && inputs.mode == 'rollback'
          && needs.build.result == 'skipped'
        )
      )
    permissions:
      checks: read
      contents: read
      id-token: write
      pull-requests: read
    uses: ./.github/workflows/agent-release.yml
    secrets:
      AGENT_SMOKE_BEARER_TOKEN: ${{ secrets.AGENT_PRODUCTION_SMOKE_BEARER_TOKEN }}
    with:
      target: production
      environment: Agent Production
      mode: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'deploy' }}
      image_digest: ${{ needs.build.outputs.image_digest || '' }}
      rollback_revision: ${{ inputs.rollback_revision || '' }}
      source_sha: ${{ github.sha }}
