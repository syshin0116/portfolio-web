<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">제품 상태와 LLM 입력 사이의 경계</title>
  <desc id="desc">제품 DB는 입주일 9월 30일로 최신이지만 대화 checkpoint와 모델 요청에는 9월 28일이 남아 낡은 답변이 나오는 구조</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="0.7"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#94a3b8"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#fb7185"/></marker>
    <style>
      .bg{fill:#020617}.title{font:700 29px Pretendard,"Apple SD Gothic Neo",sans-serif;fill:#f8fafc}.sub{font:15px Pretendard,"Apple SD Gothic Neo",sans-serif;fill:#94a3b8}.box{fill:#0f172a;stroke:#334155;stroke-width:1.5}.boxBlue{fill:#082f49;stroke:#38bdf8;stroke-width:1.8}.boxAmber{fill:#422006;stroke:#f59e0b;stroke-width:1.8}.boxGreen{fill:#052e2b;stroke:#34d399;stroke-width:1.8}.boxRed{fill:#4c0519;stroke:#fb7185;stroke-width:1.8}.head{font:700 17px Pretendard,"Apple SD Gothic Neo",sans-serif;fill:#f8fafc}.body{font:14px Pretendard,"Apple SD Gothic Neo",sans-serif;fill:#cbd5e1}.small{font:12px Pretendard,"Apple SD Gothic Neo",sans-serif;fill:#94a3b8}.code{font:700 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#bae6fd}.line{stroke:#94a3b8;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.blocked{stroke:#fb7185;stroke-width:2.2;stroke-dasharray:7 7;fill:none;marker-end:url(#arrowRed)}.x{stroke:#fb7185;stroke-width:4;stroke-linecap:round}.chip{fill:#1e293b;stroke:#475569;stroke-width:1}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/><rect width="1280" height="720" fill="url(#grid)" opacity=".75"/>
  <text x="54" y="62" class="title">제품 DB는 최신인데 LLM 답변은 왜 낡을까</text>
  <text x="54" y="91" class="sub">제품 상태, 대화 checkpoint, ModelRequest는 서로 다른 저장 경계</text>

  <rect x="54" y="132" width="260" height="112" rx="16" class="box"/>
  <text x="78" y="165" class="head">사람 또는 AI의 변경</text>
  <text x="78" y="194" class="body">입주일 9월 28일 → 9월 30일</text>
  <text x="78" y="220" class="small">화면 저장, AI 도구 호출</text>

  <rect x="392" y="132" width="300" height="148" rx="16" class="boxBlue"/>
  <text x="418" y="166" class="head">제품 DB</text>
  <text x="418" y="200" class="code">move_in_date = 2026-09-30</text>
  <text x="418" y="228" class="body">현재 제품 상태의 정본</text>
  <text x="418" y="254" class="small">저장 직후 화면에는 최신값 반영</text>

  <rect x="392" y="382" width="300" height="148" rx="16" class="boxAmber"/>
  <text x="418" y="416" class="head">대화 B checkpoint</text>
  <text x="418" y="450" class="code">history: 2026-09-28 기준</text>
  <text x="418" y="478" class="body">이전 메시지와 graph state</text>
  <text x="418" y="504" class="small">제품 DB 변경으로 자동 갱신되지 않음</text>

  <rect x="818" y="292" width="370" height="196" rx="18" class="boxGreen"/>
  <text x="846" y="329" class="head">LLM이 실제로 받는 ModelRequest</text>
  <rect x="846" y="351" width="314" height="34" rx="8" class="chip"/>
  <text x="862" y="374" class="body">HISTORY  입주일 9월 28일 기준</text>
  <rect x="846" y="394" width="314" height="34" rx="8" class="chip"/>
  <text x="862" y="417" class="body">USER  지금 일정 기준으로 알려줘</text>
  <text x="846" y="458" class="small">현재 DB 값이 요청에 없으면 9월 30일을 알 수 없음</text>

  <path d="M314 188H390" class="line"/>
  <path d="M692 456H816" class="line"/>
  <path d="M692 210C790 210 748 308 816 340" class="blocked"/>
  <line x1="752" y1="246" x2="774" y2="268" class="x"/><line x1="774" y1="246" x2="752" y2="268" class="x"/>
  <text x="718" y="234" class="small" fill="#fecdd3">자동 전달 없음</text>

  <rect x="54" y="588" width="1134" height="82" rx="16" class="boxRed"/>
  <text x="82" y="622" class="head">Graph state에 값이 있음 ≠ LLM이 그 값을 봄</text>
  <text x="82" y="650" class="body">DB 조회 결과를 system message 또는 messages로 조립해야 모델 입력에 포함된다.</text>
</svg>
