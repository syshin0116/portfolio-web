name: Protocol compatibility

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  protocol-compat:
    name: protocol/compat
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - name: Install the locked protocol test environment
        run: uv sync --project agent --frozen --all-extras --dev
      - name: Lint protocol consumers
        run: >-
          uv run --project agent --frozen ruff check
          scripts/protocol_contract.py
          scripts/smoke.py
          scripts/verify_protocol_upstream.py
          protocol/tests
      - name: Check protocol consumer formatting
        run: >-
          uv run --project agent --frozen ruff format --check
          scripts/protocol_contract.py
          scripts/smoke.py
          scripts/verify_protocol_upstream.py
          protocol/tests
      - name: Verify pinned upstream schemas and generated bindings
        run: >-
          uv run --project agent --frozen
          python scripts/verify_protocol_upstream.py
      - name: Validate protocol fixtures
        run: >-
          uv run --project agent --frozen
          python scripts/protocol_contract.py
      - name: Run protocol contract tests
        run: >-
          uv run --project agent --frozen
          python -m unittest discover -s protocol/tests -v
      - name: Replay the offline smoke fixtures
        run: >-
          uv run --project agent --frozen
          python scripts/smoke.py
