<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">ReAct agent execution graph</title>
  <desc id="desc">A ReAct agent runs a pre-model hook, calls the model, applies a post-model hook, invokes tools in a loop, and optionally generates a structured response before ending.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .node { fill: #f8fafc; stroke: #475569; stroke-width: 2; }
      .terminal { fill: #e2e8f0; stroke: #475569; stroke-width: 2; }
      .label { fill: #0f172a; font: 600 18px ui-sans-serif, system-ui, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .edge-label { fill: #475569; font: 14px ui-sans-serif, system-ui, sans-serif; text-anchor: middle; }
      @media (prefers-color-scheme: dark) {
        .node { fill: #1e293b; stroke: #94a3b8; }
        .terminal { fill: #334155; stroke: #94a3b8; }
        .label { fill: #f8fafc; }
        .edge { stroke: #94a3b8; }
        .edge-label { fill: #cbd5e1; }
      }
    </style>
  </defs>

  <circle class="terminal" cx="70" cy="140" r="25"/>
  <text class="label" x="70" y="140">Start</text>

  <rect class="node" x="145" y="100" width="180" height="80" rx="12"/>
  <text class="label" x="235" y="140">pre_model_hook</text>

  <rect class="node" x="385" y="100" width="140" height="80" rx="12"/>
  <text class="label" x="455" y="140">agent</text>

  <rect class="node" x="585" y="100" width="180" height="80" rx="12"/>
  <text class="label" x="675" y="140">post_model_hook</text>

  <rect class="node" x="385" y="300" width="140" height="80" rx="12"/>
  <text class="label" x="455" y="340">tools</text>

  <rect class="node" x="585" y="300" width="220" height="80" rx="12"/>
  <text class="label" x="695" y="340">structured response</text>

  <circle class="terminal" cx="830" cy="140" r="25"/>
  <text class="label" x="830" y="140">End</text>

  <path class="edge" d="M95 140 H145"/>
  <path class="edge" d="M325 140 H385"/>
  <path class="edge" d="M525 140 H585"/>
  <path class="edge" d="M765 140 H805"/>
  <path class="edge" d="M675 180 V245 H500 V300"/>
  <text class="edge-label" x="600" y="235">tool call</text>
  <path class="edge" d="M385 340 H235 V180"/>
  <text class="edge-label" x="300" y="325">continue</text>
  <path class="edge" d="M675 180 V300"/>
  <text class="edge-label" x="735" y="245">response_format</text>
  <path class="edge" d="M805 340 H830 V165"/>
</svg>
