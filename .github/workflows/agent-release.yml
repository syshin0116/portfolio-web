name: Agent release

on:
  workflow_call:
    inputs:
      target:
        description: Exact isolated delivery target.
        required: true
        type: string
      environment:
        description: Exact reviewer-gated GitHub release environment.
        required: true
        type: string
      source_sha:
        description: Exact source commit baked into the reviewed candidate.
        required: true
        type: string
      image_digest:
        description: Fresh immutable image from the build workflow.
        required: true
        type: string

permissions: {}

jobs:
  release:
    name: Deploy reviewed agent image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      checks: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - name: Verify exact production revision passed CI
        if: inputs.target == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          require_current_main() {
            [[ "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" == "$SOURCE_SHA" ]]
          }
          require_current_main
          for attempt in {1..90}; do
            checks="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SOURCE_SHA}/check-runs?filter=latest&per_page=100")"
            pending=false
            for name in ci/check protocol/compat wiki/verify; do
              state="$(jq -r --arg name "$name" '
                [.check_runs[] | select(.name == $name and .app.id == 15368)]
                | if length == 0 or .[0].status != "completed" then "pending"
                  elif length != 1 then "failure"
                  else .[0].conclusion end
              ' <<<"$checks")"
              case "$state" in
                success) ;;
                pending) pending=true ;;
                *) printf '%s did not pass: %s\n' "$name" "$state" >&2; exit 1 ;;
              esac
            done
            [[ "$pending" == false ]] && break
            (( attempt < 90 )) || { printf 'required CI checks timed out\n' >&2; exit 1; }
            sleep 10
          done
          require_current_main
      - name: Select exact deployer identity
        id: delivery_identity
        env:
          DELIVERY_ENVIRONMENT: ${{ inputs.environment }}
          DELIVERY_ROLE: deployer
          DELIVERY_TARGET: ${{ inputs.target }}
        shell: bash
        run: scripts/validate_agent_delivery_identity.sh >>"$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ steps.delivery_identity.outputs.workload_identity_provider }}
          service_account: ${{ steps.delivery_identity.outputs.service_account }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: "577.0.0"
      - name: Deploy, smoke, and promote
        env:
          CLOUD_RUN_SERVICE: ${{ steps.delivery_identity.outputs.cloud_run_service }}
          GCP_PROJECT_ID: festive-ally-503605-v7
          GCP_REGION: asia-southeast1
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TARGET: ${{ inputs.target }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$TARGET" in
            preview)
              expected_repository="asia-southeast1-docker.pkg.dev/${GCP_PROJECT_ID}/agent-preview/agent"
              ;;
            production)
              expected_repository="asia-southeast1-docker.pkg.dev/${GCP_PROJECT_ID}/agent/agent"
              ;;
            *)
              printf 'unsupported deployment target\n' >&2
              exit 1
              ;;
          esac
          digest="${IMAGE_DIGEST#"${expected_repository}@sha256:"}"
          [[ "$IMAGE_DIGEST" == "${expected_repository}@sha256:${digest}" ]]
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]

          smoke_tag_active=false
          cleanup_smoke_tag() {
            status=$?
            trap - EXIT
            if [[ "$smoke_tag_active" == true ]]; then
              gcloud run services update-traffic "$CLOUD_RUN_SERVICE" \
                --project "$GCP_PROJECT_ID" \
                --region "$GCP_REGION" \
                --remove-tags smoke \
                --quiet || true
            fi
            exit "$status"
          }
          trap cleanup_smoke_tag EXIT

          smoke_tag_active=true
          gcloud run services update "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "$IMAGE_DIGEST" \
            --no-traffic \
            --tag smoke \
            --deploy-health-check \
            --quiet
          revision="$(
            gcloud run services describe "$CLOUD_RUN_SERVICE" \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" \
              --format 'value(status.latestReadyRevisionName)'
          )"
          deployed_image="$(
            gcloud run revisions describe "$revision" \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" \
              --format 'value(spec.containers[0].image)'
          )"
          [[ "$deployed_image" == "$IMAGE_DIGEST" ]]

          smoke_url="$(
            gcloud run services describe "$CLOUD_RUN_SERVICE" \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" \
              --format json \
              | jq -er '
                [.status.traffic[] | select(.tag == "smoke") | .url]
                | if length == 1 and (.[0] | type == "string")
                    and (.[0] | startswith("https://"))
                  then .[0]
                  else error("Cloud Run did not return exactly one smoke URL") end
              '
          )"

          verify_release() {
            curl --fail --silent --show-error --max-time 20 \
              --retry 5 --retry-all-errors --retry-delay 2 \
              "${smoke_url}/live" | jq -e '. == {"status":"alive"}' >/dev/null
            curl --fail --silent --show-error --max-time 20 \
              --retry 5 --retry-all-errors --retry-delay 2 \
              "${smoke_url}/ready" | jq -e '. == {"status":"ready"}' >/dev/null
            unauthenticated_status="$(
              curl --silent --show-error --max-time 20 --max-redirs 0 \
                --output /dev/null \
                --write-out '%{http_code}' \
                --header 'content-type: application/json' \
                --data \
                  '{"id":1,"method":"run.start","params":{"assistant_id":"agent","input":{"messages":[{"role":"user","content":"smoke"}]}}}' \
                "${smoke_url}/threads/00000000-0000-4000-8000-000000000001/commands"
            )"
            [[ "$unauthenticated_status" == "401" ]]
          }

          verify_release

          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --remove-tags smoke \
            --quiet
          smoke_tag_active=false
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --to-revisions "${revision}=100" \
            --quiet
          trap - EXIT
          printf 'Cloud Run release passed: %s %s\n' "$revision" "$IMAGE_DIGEST"
