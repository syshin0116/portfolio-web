name: Agent delivery

on:
  workflow_call:
    inputs:
      environment:
        description: Exact GitHub deployment environment.
        required: true
        type: string
      service:
        description: Exact Cloud Run service name.
        required: true
        type: string
      migration_job:
        description: Exact one-shot migration job name.
        required: true
        type: string
      grant_probe_job:
        description: Exact real-Neon grant probe job name.
        required: true
        type: string
      mode:
        description: Deploy the caller SHA or roll traffic back.
        required: true
        type: string
      rollback_revision:
        description: Exact existing revision for rollback mode.
        required: false
        default: ""
        type: string
permissions: {}

jobs:
  build:
    name: Build immutable agent image
    if: inputs.mode == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    outputs:
      image_digest: ${{ steps.image.outputs.image_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate immutable delivery inputs
        env:
          BUILDER_SERVICE_ACCOUNT: ${{ vars.GCP_BUILDER_SERVICE_ACCOUNT }}
          DELIVERY_ENVIRONMENT: ${{ inputs.environment }}
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DELIVERY_ENVIRONMENT" == "Agent Preview" || "$DELIVERY_ENVIRONMENT" == "Agent Production" ]]
          [[ "$BUILDER_SERVICE_ACCOUNT" == "agent-image-builder@festive-ally-503605-v7.iam.gserviceaccount.com" ]]
          case "$DELIVERY_ENVIRONMENT" in
            "Agent Preview")
              [[ "$WORKLOAD_IDENTITY_PROVIDER" == "projects/72919926064/locations/global/workloadIdentityPools/github/providers/github-preview" ]]
              ;;
            "Agent Production")
              [[ "$WORKLOAD_IDENTITY_PROVIDER" == "projects/72919926064/locations/global/workloadIdentityPools/github/providers/github-production" ]]
              ;;
          esac
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_BUILDER_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: "555.0.0"
      - name: Build once and resolve the registry digest
        id: image
        env:
          IMAGE_REPOSITORY: us-east4-docker.pkg.dev/festive-ally-503605-v7/agent/agent
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gcloud auth configure-docker us-east4-docker.pkg.dev --quiet
          image_tag="${IMAGE_REPOSITORY}:git-${SOURCE_SHA}"
          if resolved="$(docker buildx imagetools inspect "$image_tag" --format '{{.Name}}' 2>/dev/null)"; then
            digest="${resolved##*@}"
          else
            metadata_file="$RUNNER_TEMP/agent-image-metadata.json"
            docker buildx build \
              --platform linux/amd64 \
              --provenance=mode=max \
              --sbom=true \
              --build-arg "VCS_REF=${SOURCE_SHA}" \
              --tag "$image_tag" \
              --metadata-file "$metadata_file" \
              --push \
              .
            digest="$(jq -er '."containerimage.digest"' "$metadata_file")"
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_digest="${IMAGE_REPOSITORY}@${digest}"
          docker buildx imagetools inspect "$image_digest" >/dev/null
          printf 'image_digest=%s\n' "$image_digest" >>"$GITHUB_OUTPUT"

  deploy:
    name: Migrate, grant-check, deploy, and smoke
    if: inputs.mode == 'deploy'
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    concurrency:
      group: agent-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: "555.0.0"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - name: Execute fail-closed delivery
        env:
          CLOUD_RUN_SERVICE: ${{ inputs.service }}
          GCP_PROJECT_ID: festive-ally-503605-v7
          GCP_REGION: us-east4
          GRANT_PROBE_JOB: ${{ inputs.grant_probe_job }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
          MIGRATION_JOB: ${{ inputs.migration_job }}
          SMOKE_BEARER_TOKEN: ${{ secrets.AGENT_SMOKE_BEARER_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: scripts/deploy_cloud_run.sh deploy

  rollback:
    name: Roll back revision traffic and smoke
    if: inputs.mode == 'rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    concurrency:
      group: agent-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: "555.0.0"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - name: Shift traffic to the reviewed revision
        env:
          CLOUD_RUN_SERVICE: ${{ inputs.service }}
          GCP_PROJECT_ID: festive-ally-503605-v7
          GCP_REGION: us-east4
          SMOKE_BEARER_TOKEN: ${{ secrets.AGENT_SMOKE_BEARER_TOKEN }}
        run: >-
          scripts/deploy_cloud_run.sh
          rollback
          "${{ inputs.rollback_revision }}"
