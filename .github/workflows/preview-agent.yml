name: Agent preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - ".dockerignore"
      - "Dockerfile"
      - "Dockerfile.dockerignore"
      - "aegra.json"
      - "agent/**"
      - "content/**"
      - "eval/pyproject.toml"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/build_index.py"
      - "scripts/deploy_cloud_run.sh"
      - "scripts/smoke.py"
      - "scripts/resolve_agent_runtime_image.py"
      - "scripts/validate_agent_release_candidate.py"
      - "scripts/validate_agent_delivery_identity.sh"
      - ".github/workflows/agent-image-build.yml"
      - ".github/workflows/agent-release.yml"
      - ".github/workflows/preview-agent.yml"
permissions: {}

concurrency:
  group: agent-preview
  cancel-in-progress: false

jobs:
  build:
    name: agent/preview-build
    if: >-
      github.event_name == 'pull_request'
      && vars.AGENT_CLOUD_RUN_ENABLED == 'true'
      && vars.AGENT_CLOUD_RUN_PREVIEW_ENABLED == 'true'
      && github.actor != 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/agent-image-build.yml
    with:
      target: preview
      source_sha: ${{ github.event.pull_request.head.sha }}

  release:
    name: agent/preview-release
    needs:
      - build
    if: needs.build.result == 'success'
    permissions:
      checks: read
      contents: read
      id-token: write
      pull-requests: read
    uses: ./.github/workflows/agent-release.yml
    secrets:
      AGENT_SMOKE_BEARER_TOKEN: ${{ secrets.AGENT_PREVIEW_SMOKE_BEARER_TOKEN }}
    with:
      target: preview
      environment: Agent Preview
      mode: deploy
      image_digest: ${{ needs.build.outputs.image_digest }}
      pull_request_number: ${{ github.event.pull_request.number }}
      source_sha: ${{ github.event.pull_request.head.sha }}
