<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Technical Radar Scoring Model</title>
  <desc id="desc">A scoring model that weighs relevance, maturity delta, growth, trust, and adoption cost, then classifies repositories into spike, adopt candidate, reference, monitor, or ignore.</desc>
  <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 L0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.6"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker><style>.bg{fill:#020617}.title{font:700 28px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#e2e8f0}.sub{font:14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#94a3b8}.box{fill:#0f172a;stroke:#334155;stroke-width:1.4;rx:14}.metric{fill:rgba(76,29,149,.55);stroke:#a78bfa;stroke-width:1.5;rx:12}.decision{fill:rgba(6,78,59,.62);stroke:#34d399;stroke-width:1.5;rx:12}.warn{fill:rgba(136,19,55,.55);stroke:#fb7185;stroke-width:1.5;rx:12}.text{font:700 15px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f8fafc}.small{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#cbd5e1}.tiny{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#94a3b8}.pct{font:700 26px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f8fafc}.line{stroke:#94a3b8;stroke-width:2.2;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1280" height="720"/><rect width="1280" height="720" fill="url(#grid)" opacity=".8"/>
  <text x="50" y="58" class="title">Scoring Model: 발견 신호보다 활용 가능성을 크게 본다</text><text x="50" y="84" class="sub">새 레포는 growth를, watchlist 레포는 changelog와 maturity delta를 더 크게 반영</text>
  <rect x="55" y="145" width="210" height="100" class="box"/><text x="92" y="180" class="text">Raw signals</text><text x="82" y="206" class="small">repo · release · docs</text><text x="82" y="226" class="small">news · paper · social</text>
  <rect x="340" y="95" width="210" height="92" class="metric"/><text x="365" y="126" class="pct">30%</text><text x="438" y="126" class="text">Relevance</text><text x="366" y="156" class="small">내 프로젝트와 직접 연결?</text>
  <rect x="340" y="210" width="210" height="92" class="metric"/><text x="365" y="241" class="pct">25%</text><text x="438" y="241" class="text">Maturity</text><text x="366" y="271" class="small">release/docs/examples 개선</text>
  <rect x="340" y="325" width="210" height="92" class="metric"/><text x="365" y="356" class="pct">15%</text><text x="438" y="356" class="text">Growth</text><text x="366" y="386" class="small">star velocity, mentions</text>
  <rect x="340" y="440" width="210" height="92" class="metric"/><text x="365" y="471" class="pct">15%</text><text x="438" y="471" class="text">Trust</text><text x="366" y="501" class="small">maintainer, license</text>
  <rect x="340" y="555" width="210" height="92" class="warn"/><text x="365" y="586" class="pct">15%</text><text x="438" y="586" class="text">Cost/Risk</text><text x="366" y="616" class="small">install, API, migration</text>
  <rect x="660" y="250" width="220" height="115" class="box"/><text x="705" y="290" class="text">Action score</text><text x="695" y="318" class="small">weighted score + flags</text><text x="690" y="340" class="tiny">breaking/security/docs delta</text>
  <rect x="990" y="110" width="220" height="58" class="decision"/><text x="1065" y="145" class="text">Adopt</text>
  <rect x="990" y="205" width="220" height="58" class="decision"/><text x="1067" y="240" class="text">Spike</text>
  <rect x="990" y="300" width="220" height="58" class="decision"/><text x="1047" y="335" class="text">Reference</text>
  <rect x="990" y="395" width="220" height="58" class="decision"/><text x="1060" y="430" class="text">Monitor</text>
  <rect x="990" y="490" width="220" height="58" class="warn"/><text x="1062" y="525" class="text">Ignore</text>
  <path class="line" d="M265 195 C300 195 300 141 338 141"/><path class="line" d="M265 195 C303 195 303 256 338 256"/><path class="line" d="M265 195 C302 195 303 371 338 371"/><path class="line" d="M265 195 C302 195 303 486 338 486"/><path class="line" d="M265 195 C302 195 303 601 338 601"/>
  <path class="line" d="M550 141 C610 141 610 286 658 286"/><path class="line" d="M550 256 L658 304"/><path class="line" d="M550 371 C612 371 612 330 658 330"/><path class="line" d="M550 486 C610 486 610 342 658 342"/><path class="line" d="M550 601 C620 601 620 350 658 350"/>
  <path class="line" d="M880 308 C930 308 930 139 988 139"/><path class="line" d="M880 308 C930 308 930 234 988 234"/><path class="line" d="M880 308 L988 329"/><path class="line" d="M880 308 C930 308 930 424 988 424"/><path class="line" d="M880 308 C930 308 930 519 988 519"/>
  <rect x="655" y="585" width="510" height="54" class="box"/><text x="682" y="608" class="small">Rule of thumb: star spike만으로 spike하지 않는다.</text><text x="682" y="628" class="tiny">changelog에 examples, migration guide, security/breaking flag가 있는지 함께 본다.</text>
</svg>
