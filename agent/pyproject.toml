[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "syshin0116-dev-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aegra-api==0.9.24",
    "aegra-cli==0.9.24",
    "deepagents==0.6.12",
    "langchain==1.3.14",
    "langchain-core==1.4.9",
    "langsmith==0.10.10",
    "langgraph==1.2.9",
    "langgraph-sdk==0.4.2",
    "PyJWT==2.13.0",
    "langchain-anthropic",
    "langchain-openai",
    "fastapi>=0.139.2",
    "rank-bm25==0.2.2",
    "kiwipiepy==0.23.2",
    "kiwipiepy-model==0.23.0",
    "numpy==2.4.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort (import 정렬)
    "N",      # pep8-naming
    "UP",     # pyupgrade (최신 문법 권장)
    "B",      # flake8-bugbear (일반적 버그 패턴)
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "ASYNC",  # flake8-async
    "FAST",   # FastAPI 전용 규칙
]
ignore = ["E501"]  # line-length는 formatter에 위임

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "python-hcl2==7.3.1",
    "asgi-lifespan>=2.1.0",
    "langgraph-cli>=0.4.31",
]
