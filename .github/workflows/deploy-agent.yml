name: Deploy agent

on:
  push:
    branches:
      - main
    paths:
      - ".dockerignore"
      - "Dockerfile"
      - "Dockerfile.dockerignore"
      - "aegra.json"
      - "agent/**"
      - "content/**"
      - "eval/pyproject.toml"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/build_index.py"
      - "scripts/smoke.py"
      - "scripts/validate_agent_delivery_identity.sh"
      - ".github/workflows/agent-image-build.yml"
      - ".github/workflows/agent-release.yml"
      - ".github/workflows/deploy-agent.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: agent-production
  cancel-in-progress: false

jobs:
  build:
    name: agent/production-build
    if: vars.AGENT_CLOUD_RUN_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/agent-image-build.yml
    with:
      target: production
      source_sha: ${{ github.sha }}

  release:
    name: agent/production-release
    needs:
      - build
    if: needs.build.result == 'success'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/agent-release.yml
    secrets:
      AGENT_SMOKE_BEARER_TOKEN: ${{ secrets.AGENT_PRODUCTION_SMOKE_BEARER_TOKEN }}
    with:
      target: production
      environment: Agent Production
      image_digest: ${{ needs.build.outputs.image_digest }}
      source_sha: ${{ github.sha }}
