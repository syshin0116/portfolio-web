name: Wiki verify

on:
  pull_request:
    paths:
      - "content/**/*.md"
      - "content/wiki/**"
      - ".agents/skills/wiki-curator/**"
      - ".claude/skills/wiki-curator/**"
      - "scripts/verify-wiki.py"
      - ".github/workflows/wiki-verify.yml"
  push:
    branches:
      - main
    paths:
      - "content/**/*.md"
      - "content/wiki/**"
      - ".agents/skills/wiki-curator/**"
      - ".claude/skills/wiki-curator/**"
      - "scripts/verify-wiki.py"
      - ".github/workflows/wiki-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Verify canonical wiki contract
        run: bun .agents/skills/wiki-curator/scripts/verify.ts
      - name: Verify dependency-free CI mirror
        run: python scripts/verify-wiki.py
