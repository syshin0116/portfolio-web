name: Dependency audit

on:
  schedule:
    # Monday 03:17 Asia/Seoul. Keep this offset from Dependabot's 04:00 run.
    - cron: "17 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: dependency/web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - name: Verify the committed web lock
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Audit high and critical web vulnerabilities
        run: bun audit --audit-level=high

  agent:
    name: dependency/agent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          checksum: 04f8b82f5d47f0512dcd32c67a4a6f16a0ea27c81537c338fd0ad6b23cebe829
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - name: Verify and export the committed agent lock
        run: |
          uv lock --project agent --check
          uv export \
            --project agent \
            --frozen \
            --all-extras \
            --no-emit-project \
            --no-hashes \
            --format requirements-txt \
            --output-file "$RUNNER_TEMP/agent-requirements.txt"
      - name: Audit the exact agent resolution
        run: >-
          uvx --from pip-audit==2.10.1
          pip-audit
          --disable-pip
          --no-deps
          --progress-spinner=off
          --requirement "$RUNNER_TEMP/agent-requirements.txt"

  check:
    name: dependency/audit
    if: always()
    needs:
      - web
      - agent
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require both ecosystem audits to pass
        env:
          WEB_RESULT: ${{ needs.web.result }}
          AGENT_RESULT: ${{ needs.agent.result }}
        shell: bash
        run: |
          echo "dependency/web=$WEB_RESULT"
          echo "dependency/agent=$AGENT_RESULT"
          [[ "$WEB_RESULT" == "success" && "$AGENT_RESULT" == "success" ]]
