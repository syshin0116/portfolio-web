version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      web-routine:
        applies-to: "version-updates"
        patterns:
          - "*"
        exclude-patterns:
          # Framework/protocol/auth bumps need focused compatibility evidence.
          - "@assistant-ui/*"
          - "@auth/*"
          - "@langchain/*"
          - "next"
          - "next-auth"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "uv"
    directory: "/agent"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:20"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      agent-routine:
        applies-to: "version-updates"
        patterns:
          - "*"
        exclude-patterns:
          # These are compatibility surfaces and must remain isolated bump PRs.
          - "aegra-*"
          - "deepagents"
          - "langchain"
          - "langchain-*"
          - "langgraph"
          - "langgraph-*"
          - "langsmith"
          - "numpy"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:40"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      actions-routine:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
