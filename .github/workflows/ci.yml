name: Application CI

on:
  pull_request:
    paths:
      - "web/**"
      - "agent/**"
      - "content/**"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "agent/**"
      - "content/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      AUTH_SECRET: ci-only-auth-secret-ci-only-auth-secret
      AUTH_ALLOWED_EMAILS: ci@example.com
      AGENT_AUTH_SECRET: ci-only-agent-secret-ci-only-agent-secret
      NEXT_PUBLIC_AGENT_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run prebuild
      - run: bun run test
      - run: bun run lint
      - run: bunx tsc --noEmit --incremental false
      - run: bun run build

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    env:
      AGENT_AUTH_SECRET: ci-only-agent-secret-ci-only-agent-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras --dev
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run --all-extras pytest -q
