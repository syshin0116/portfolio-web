[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "syshin0116-dev-eval"
version = "0.1.0"
description = "Offline, reproducible retrieval evaluation for syshin0116.dev"
requires-python = ">=3.12"
dependencies = [
    "syshin0116-dev-agent",
]

[project.optional-dependencies]
dense = [
    "sentence-transformers==5.6.0",
    "torch==2.13.0",
    "transformers==5.14.1",
]

[project.scripts]
blogeval = "blogeval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
syshin0116-dev-agent = { workspace = true }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "real_dense: opt-in smoke against an already-cached pinned embedding model",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
