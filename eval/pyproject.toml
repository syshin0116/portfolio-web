[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "syshin0116-dev-eval"
version = "0.1.0"
description = "Offline, reproducible retrieval evaluation for syshin0116.dev"
requires-python = ">=3.12"
dependencies = [
    "syshin0116-dev-agent",
]

[project.scripts]
blogeval = "blogeval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
syshin0116-dev-agent = { path = "../agent", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.8",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
