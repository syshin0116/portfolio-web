version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      web-weekly:
        applies-to: "version-updates"
        patterns:
          - "*"
    ignore:
      # These majors fail the current lint/type contract and need an app migration.
      - dependency-name: "lucide-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Bun version updates include bun.lock, but GitHub does not yet support
  # Dependabot security updates for the Bun ecosystem. Keep npm as a
  # security-only bridge; its PR must regenerate bun.lock before merge.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:10"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 0

  - package-ecosystem: "uv"
    directory: "/agent"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:20"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      agent-weekly:
        applies-to: "version-updates"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:40"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      actions-weekly:
        applies-to: "version-updates"
        patterns:
          - "*"
